name: Java

on:
  push:
  pull_request:

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Maven test
        env:
          NODE_BINARY: node
        run: mvn -B -Djava.awt.headless=true test