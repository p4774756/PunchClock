# 小寶貝桌面包：push tag v* 會建 Release 並上傳 SKLbaby.jar。
# workflow_dispatch 乾跑：Actions →「Package desktop installers」→ Run workflow，只產 jar artifact、
# 不建正式 Release。不要用 workflow_dispatch 取代正式發版。
# 正式發行只上 SKLbaby.jar，不再建 dmg／exe（Playwright driver 已改第一次使用時下載，不再打進 jar）。

name: Package desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "小寶貝 ${GITHUB_REF_NAME#v}" \
              --notes "SKLbaby.jar（需先安裝 Java 11 或以上）。" \
              --latest
          fi

  package-jar:
    needs: create-release
    if: always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build shade jar (bytecode 11)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="$(mvn -q -pl client -DforceStdout help:evaluate -Dexpression=project.version)"; fi
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B -q -pl client -am package -DskipTests -P '!git-commit-time'

      - name: Upload shade jar workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKLbaby-jar
          path: client/target/SKLbaby.jar
          if-no-files-found: error

      - name: Upload jar to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            client/target/SKLbaby.jar \
            --clobber

      - name: Upload jar to GitHub Release (published event)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            client/target/SKLbaby.jar \
            --clobber
