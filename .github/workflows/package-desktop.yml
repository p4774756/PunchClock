# 新光小寶貝桌面安裝檔：push tag v* 會建 Release 並上傳 SKLbaby-mac-arm.dmg、SKLbaby-mac-intel.dmg、
# SKLbaby-win.exe、SKLbaby.jar。
# workflow_dispatch 乾跑：Actions →「Package desktop installers」→ Run workflow，只產 workflow artifact、
# 不建正式 Release。完成後在該次 run 下載 artifact，核對檔名與大小（腳本限 15–60 MiB）。
# 不要用 workflow_dispatch 取代正式發版。

name: Package desktop installers

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "新光小寶貝 ${GITHUB_REF_NAME#v}" \
              --notes "macOS（Apple 晶片／Intel）／Windows 安裝檔與 SKLbaby.jar（尚未程式碼簽章）。" \
              --latest
          fi

  package-macos-arm:
    needs: create-release
    if: always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (jlink/jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build shade jar (bytecode 11)
        run: mvn -B -q -pl client -am package -DskipTests

      - name: Build .icns
        run: |
          chmod +x scripts/package-desktop-macos-icon.sh
          scripts/package-desktop-macos-icon.sh design/issue-305/app-icon.png build/desktop/app-icon.icns

      - name: jlink + jpackage (.dmg, Apple 晶片)
        run: |
          chmod +x scripts/package-desktop-jlink-jpackage.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="$(mvn -q -pl client -DforceStdout help:evaluate -Dexpression=project.version)"; fi
          scripts/package-desktop-jlink-jpackage.sh build/desktop/app-icon.icns dmg "$VERSION" SKLbaby-mac-arm.dmg

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SKLbaby-mac-arm-dmg
          path: build/desktop/SKLbaby-mac-arm.dmg
          if-no-files-found: error

      - name: Upload shade jar workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKLbaby-jar
          path: client/target/SKLbaby.jar
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            build/desktop/SKLbaby-mac-arm.dmg \
            client/target/SKLbaby.jar \
            --clobber

      - name: Upload to GitHub Release (published event)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            build/desktop/SKLbaby-mac-arm.dmg \
            client/target/SKLbaby.jar \
            --clobber

  package-macos-intel:
    needs: create-release
    if: always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (jlink/jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build shade jar (bytecode 11)
        run: mvn -B -q -pl client -am package -DskipTests

      - name: Build .icns
        run: |
          chmod +x scripts/package-desktop-macos-icon.sh
          scripts/package-desktop-macos-icon.sh design/issue-305/app-icon.png build/desktop/app-icon.icns

      - name: jlink + jpackage (.dmg, Intel)
        run: |
          chmod +x scripts/package-desktop-jlink-jpackage.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="$(mvn -q -pl client -DforceStdout help:evaluate -Dexpression=project.version)"; fi
          scripts/package-desktop-jlink-jpackage.sh build/desktop/app-icon.icns dmg "$VERSION" SKLbaby-mac-intel.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKLbaby-mac-intel-dmg
          path: build/desktop/SKLbaby-mac-intel.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            build/desktop/SKLbaby-mac-intel.dmg \
            --clobber

      - name: Upload to GitHub Release (published event)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            build/desktop/SKLbaby-mac-intel.dmg \
            --clobber

  package-windows:
    needs: create-release
    if: always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (jlink/jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node (ico)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build shade jar (bytecode 11)
        shell: bash
        run: mvn -B -q -pl client -am package -DskipTests

      - name: Build .ico
        shell: bash
        run: |
          npm install --no-save to-ico pngjs
          node scripts/package-desktop-windows-icon.mjs design/issue-305/app-icon.png build/desktop/app-icon.ico

      - name: jlink + jpackage (.exe)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION="$(mvn -q -pl client -DforceStdout help:evaluate -Dexpression=project.version)"; fi
          bash scripts/package-desktop-jlink-jpackage.sh build/desktop/app-icon.ico exe "$VERSION"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKLbaby-win-exe
          path: build/desktop/SKLbaby-win.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/desktop/SKLbaby-win.exe --clobber

      - name: Upload to GitHub Release (published event)
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" build/desktop/SKLbaby-win.exe --clobber