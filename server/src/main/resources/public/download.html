<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下載小寶貝桌面端</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/lab-office.css">
  <link rel="stylesheet" href="/css/maple-close-x.css">
  <link rel="stylesheet" href="/css/download.css">
</head>
<body class="lab-office-page download-page">
  <section class="download-root" aria-label="下載桌面端">
    <header class="lab-office-head">
      <h1>下載小寶貝</h1>
      <a class="roadmap-close-x" href="/" aria-label="回辦公室">×</a>
    </header>
    <div class="download-body">
      <p>在此下載小寶貝桌面端 jar。請先安裝 Java，再以 jar 啟動。</p>
      <div class="download-actions" data-download-actions>
        <a class="download-btn download-btn-jar" data-download-jar href="{{JAR_DOWNLOAD_URL}}"{{JAR_HIDDEN}}>下載 SKLbaby.jar</a>
        <p class="download-unavailable" data-download-missing{{MISSING_HIDDEN}}>伺服器尚未附帶可下載的 jar，請向管理員索取。</p>
      </div>
      <p class="download-version"{{VERSION_HIDDEN}}>目前版本：v{{CLIENT_VERSION}}</p>
      <h2>如何執行</h2>
      <p>需要已安裝 <strong>Java {{JAVA_VERSION}}</strong> 或以上。</p>
      <ol class="download-steps">
        <li>下載完成後在 Finder 或檔案總管找到 jar 檔。</li>
        <li>第一次執行請在 jar 上<strong>右鍵 → 打開</strong>，通過安全性提示。</li>
        <li>之後可在終端機執行：<code class="download-cmd">java -Xdock:name=小寶貝 -jar SKLbaby.jar</code></li>
      </ol>
    </div>
  </section>
</body>
</html>
