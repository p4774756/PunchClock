<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的私人團隊 · 新光小寶貝</title>
  <link rel="stylesheet" href="/css/lab-office.css">
  <link rel="stylesheet" href="/css/guestbook.css">
  <link rel="stylesheet" href="/css/roadmap.css">
  <link rel="stylesheet" href="/css/dev-guest-ui.css">
  <link rel="stylesheet" href="/css/private-team.css">
</head>
<body class="lab-office-page {{AUTH_BODY_CLASS}}">
  <script>window.PUNCHCLOCK_AUTHENTICATED = {{AUTH_JS_BOOL}};</script>
  <nav class="private-team-sr-auth" aria-hidden="true">
    <a href="/login?next=/" data-guest-only>登入</a>
    <a href="/logout" data-auth-only>登出</a>
  </nav>
  <section class="lab-office-root is-page private-team-page" id="officePage" aria-label="我的私人團隊">
    <div class="lab-office-frame">
      <div class="lab-office-stage" data-private-team-stage>
        <!-- 3D 場景與 HUD 由 office-page.js 掛載 -->
      </div>
    </div>
  </section>
  <section id="guestbookBoard" class="guestbook-board" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="訪客簽名簿">
    <div class="guestbook-book">
      <header class="guestbook-book-head">
        <h2>訪客簽名簿</h2>
        <button type="button" class="btn btn-ghost" data-guestbook-close aria-label="關閉">關閉</button>
      </header>
      <div class="guestbook-book-open">
      <div class="guestbook-pages">
        <div class="guestbook-page guestbook-page-form">
          <h3 class="guestbook-page-title">填寫</h3>
          <div class="guestbook-field">
            <label for="guestbookNickname">暱稱</label>
            <input id="guestbookNickname" data-guestbook-nickname maxlength="20" autocomplete="nickname" required aria-required="true">
          </div>
          <div class="guestbook-field">
            <label for="guestbookMessage">留言</label>
            <textarea id="guestbookMessage" data-guestbook-message maxlength="200" required aria-required="true" placeholder="最多 200 字"></textarea>
          </div>
          <input type="text" class="guestbook-honeypot" data-guestbook-honeypot name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="guestbook-doodle-wrap">
            <p class="guestbook-doodle-label">小塗鴉（可不畫）</p>
            <canvas class="guestbook-canvas" data-guestbook-paint width="240" height="120" aria-label="小塗鴉畫布"></canvas>
          </div>
          <div class="guestbook-tools" role="group" aria-label="畫筆">
            <button type="button" class="guestbook-swatch" data-guestbook-color="#1f2430" style="background:#1f2430" aria-label="黑色"></button>
            <button type="button" class="guestbook-swatch" data-guestbook-color="#e03c3c" style="background:#e03c3c" aria-label="紅色"></button>
            <button type="button" class="guestbook-swatch" data-guestbook-color="#2563eb" style="background:#2563eb" aria-label="藍色"></button>
            <button type="button" class="guestbook-swatch" data-guestbook-color="#22a06b" style="background:#22a06b" aria-label="綠色"></button>
            <button type="button" class="guestbook-swatch" data-guestbook-color="#f4a0c0" style="background:#f4a0c0" aria-label="粉色"></button>
            <button type="button" class="guestbook-swatch" data-guestbook-color="#f06a2a" style="background:#f06a2a" aria-label="橘色"></button>
            <button type="button" class="guestbook-icon-btn guestbook-brush" data-guestbook-brush="2" aria-label="細筆" title="細筆">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="11" width="3" height="3" fill="#5c4a3a"/><rect x="5" y="8" width="3" height="3" fill="#8b6914"/><rect x="8" y="5" width="3" height="3" fill="#2563eb"/><rect x="11" y="2" width="3" height="3" fill="#1a3550"/></svg>
            </button>
            <button type="button" class="guestbook-icon-btn guestbook-brush" data-guestbook-brush="8" aria-label="粗筆" title="粗筆">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="11" width="5" height="4" fill="#5c4a3a"/><rect x="4" y="7" width="5" height="4" fill="#8b6914"/><rect x="7" y="3" width="5" height="4" fill="#2563eb"/></svg>
            </button>
            <button type="button" class="guestbook-icon-btn" data-guestbook-eraser aria-pressed="false" aria-label="橡皮擦" title="橡皮擦">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="9" width="10" height="4" fill="#f4a0c0"/><rect x="4" y="5" width="8" height="4" fill="#f4c8d8"/><rect x="6" y="2" width="4" height="3" fill="#fff"/></svg>
            </button>
            <button type="button" class="guestbook-icon-btn" data-guestbook-clear aria-label="清除畫布" title="清除">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" fill="#fff" stroke="#c45a52" stroke-width="1"/><rect x="5" y="7" width="6" height="2" fill="#e03c3c"/></svg>
            </button>
          </div>
          <div class="guestbook-emoji-row" role="group" aria-label="表情">
            <button type="button" class="guestbook-icon-btn guestbook-emoji" data-guestbook-emoji="smile" aria-label="笑臉" title="笑臉">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="2" height="2" fill="#1a3550"/><rect x="10" y="4" width="2" height="2" fill="#1a3550"/><rect x="4" y="10" width="2" height="1" fill="#1a3550"/><rect x="6" y="11" width="4" height="1" fill="#1a3550"/><rect x="10" y="10" width="2" height="1" fill="#1a3550"/><rect x="3" y="2" width="10" height="12" fill="none" stroke="#f6d35a" stroke-width="1"/></svg>
            </button>
            <button type="button" class="guestbook-icon-btn guestbook-emoji" data-guestbook-emoji="heart" aria-label="愛心" title="愛心">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="2" height="2" fill="#e03c3c"/><rect x="10" y="4" width="2" height="2" fill="#e03c3c"/><rect x="2" y="6" width="4" height="2" fill="#e03c3c"/><rect x="10" y="6" width="4" height="2" fill="#e03c3c"/><rect x="2" y="8" width="12" height="2" fill="#e03c3c"/><rect x="4" y="10" width="8" height="2" fill="#e03c3c"/><rect x="6" y="12" width="4" height="2" fill="#e03c3c"/></svg>
            </button>
            <button type="button" class="guestbook-icon-btn guestbook-emoji" data-guestbook-emoji="thumbs" aria-label="讚" title="讚">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="5" height="8" fill="#f6d35a"/><rect x="8" y="2" width="5" height="5" fill="#f6d35a"/><rect x="3" y="11" width="5" height="3" fill="#5c4a3a"/></svg>
            </button>
            <button type="button" class="guestbook-icon-btn guestbook-emoji" data-guestbook-emoji="angry" aria-label="生氣" title="生氣">
              <svg class="guestbook-pixel-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="5" width="3" height="1" fill="#1a3550"/><rect x="10" y="5" width="3" height="1" fill="#1a3550"/><rect x="4" y="3" width="2" height="1" fill="#e03c3c"/><rect x="10" y="3" width="2" height="1" fill="#e03c3c"/><rect x="5" y="10" width="6" height="1" fill="#1a3550"/><rect x="4" y="11" width="2" height="1" fill="#1a3550"/><rect x="10" y="11" width="2" height="1" fill="#1a3550"/></svg>
            </button>
          </div>
          <button type="button" class="btn guestbook-submit" data-guestbook-submit>簽名</button>
          <p class="guestbook-status" data-guestbook-status role="status"></p>
        </div>
        <div class="guestbook-page guestbook-page-list">
          <h3 class="guestbook-page-title">最新留言</h3>
          <div class="guestbook-list" data-guestbook-list aria-live="polite"></div>
        </div>
      </div>
      <div class="guestbook-ribbon" aria-hidden="true"></div>
      </div>
      <footer class="guestbook-foot">
        <span>一分鐘可留一則</span>
        <div class="guestbook-pager">
          <button type="button" class="btn btn-ghost" data-guestbook-prev aria-label="上一頁">‹</button>
          <span data-guestbook-page> 1/1 </span>
          <button type="button" class="btn btn-ghost" data-guestbook-next aria-label="下一頁">›</button>
        </div>
      </footer>
    </div>
  </section>
  <section id="roadmapBoard" class="roadmap-board" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="施工進度">
    <div class="roadmap-panel maple-window">
      <header class="maple-win-title roadmap-win-head">
        <h2>施工進度</h2>
        <button type="button" class="roadmap-close-x" data-roadmap-back aria-label="關閉">×</button>
      </header>
      <div class="roadmap-banner">
        <div class="roadmap-banner-text">
          <strong class="roadmap-now" data-roadmap-headline>施工進度</strong>
          <span class="roadmap-phase-name" data-roadmap-title></span>
        </div>
        <div class="roadmap-banner-progress">
          <span class="roadmap-total-label" data-roadmap-total-label>子項合計 0/0</span>
          <div class="roadmap-progress-track"><span class="roadmap-progress-bar" data-roadmap-total-bar></span></div>
        </div>
      </div>
      <div class="roadmap-tabs" role="tablist" aria-label="施工進度分頁">
        <button type="button" class="roadmap-tab is-active" data-roadmap-tab="phases" role="tab" aria-pressed="true">路線圖</button>
        <button type="button" class="roadmap-tab" data-roadmap-tab="dev" role="tab" aria-pressed="false">開發進度</button>
      </div>
      <div class="roadmap-layout">
        <aside class="roadmap-today-panel maple-window" data-roadmap-today aria-label="今日完成"></aside>
        <div class="roadmap-main-stack">
          <div class="roadmap-tab-panel" data-roadmap-panel="phases">
            <div class="roadmap-list" data-roadmap-list></div>
          </div>
          <section class="roadmap-tab-panel roadmap-dev" data-roadmap-panel="dev" hidden aria-label="開發進度">
            <p class="roadmap-dev-note" data-dev-note></p>
            <div class="roadmap-dev-focus">
              <div class="roadmap-dev-card" data-dev-current></div>
              <div class="roadmap-dev-card" data-dev-next></div>
            </div>
            <div class="roadmap-dev-mid">
              <div class="roadmap-dev-queue-block">
                <h4 class="roadmap-dev-sub">排隊</h4>
                <div data-dev-queue></div>
              </div>
              <div class="roadmap-dev-stats-block">
                <h4 class="roadmap-dev-sub">本週</h4>
                <div data-dev-stats></div>
              </div>
            </div>
            <h4 class="roadmap-dev-sub">進度表</h4>
            <div class="roadmap-dev-filters" data-dev-filter role="group" aria-label="狀態篩選"></div>
            <div class="roadmap-dev-table-wrap" data-dev-table></div>
            <h4 class="roadmap-dev-sub">近 7 天</h4>
            <div data-dev-timeline></div>
          </section>
        </div>
      </div>
      <p class="roadmap-note" data-roadmap-note></p>
      <footer class="roadmap-foot">
        <a class="roadmap-source" data-roadmap-source href="https://github.com/p4774756/PunchClock/issues/36" target="_blank" rel="noopener noreferrer">資料來源：GitHub #36</a>
        <span class="roadmap-dev-machines-nav" data-dev-machines-nav hidden></span>
      </footer>
    </div>
  </section>
  <script type="module" src="/js/office-page.js"></script>
</body>
</html>
