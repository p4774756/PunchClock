<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私人秘書</title>
  <link rel="stylesheet" href="/css/lab-office.css">
  <link rel="stylesheet" href="/css/roadmap.css">
  <link rel="stylesheet" href="/css/dev-guest-ui.css">
  <link rel="stylesheet" href="/css/private-team.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="lab-office-page {{AUTH_BODY_CLASS}}">
  <script>
    window.PUNCHCLOCK_AUTHENTICATED = {{AUTH_JS_BOOL}};
    window.PUNCHCLOCK_SERVER_VERSION = "{{SERVER_VERSION}}";
    window.PUNCHCLOCK_SERVER_BUILD_TIME = "{{SERVER_BUILD_TIME}}";
  </script>
  <nav class="private-team-sr-auth" aria-hidden="true">
    <a href="/login?next=/" data-guest-only tabindex="-1">登入</a>
    <a href="/logout" data-auth-only tabindex="-1">登出</a>
  </nav>
  <section class="lab-office-root is-page private-team-page" id="officePage" aria-label="私人秘書">
    <div class="lab-office-frame">
      <div class="lab-office-stage" data-private-team-stage>
        <!-- 3D 場景與 HUD 由 office-page.js 掛載 -->
      </div>
    </div>
  </section>
  <section id="roadmapBoard" class="roadmap-board" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="施工進度">
    <div class="roadmap-panel maple-window">
      <header class="maple-win-title roadmap-win-head">
        <h2>施工進度</h2>
        <button type="button" class="roadmap-close-x" data-roadmap-back aria-label="關閉">×</button>
      </header>
      <div class="roadmap-banner">
        <div class="roadmap-banner-text">
          <strong class="roadmap-now" data-roadmap-headline>施工進度</strong>
          <span class="roadmap-phase-name" data-roadmap-title></span>
        </div>
        <div class="roadmap-banner-progress">
          <span class="roadmap-total-label" data-roadmap-total-label>子項合計 0/0</span>
          <div class="roadmap-progress-track"><span class="roadmap-progress-bar" data-roadmap-total-bar></span></div>
        </div>
      </div>
      <div class="roadmap-search">
        <input type="search" class="roadmap-search-input" data-roadmap-search placeholder="搜尋 i349、#349、p372 或標題關鍵字" autocomplete="off" enterkeyhint="search" />
        <button type="button" class="roadmap-search-clear" data-roadmap-search-clear hidden>清除</button>
        <p class="roadmap-search-empty" data-roadmap-search-empty hidden>找不到</p>
      </div>
      <div class="roadmap-layout">
        <div class="roadmap-main-stack">
          <div class="roadmap-list" data-roadmap-list></div>
        </div>
      </div>
      <p class="roadmap-note" data-roadmap-note></p>
      <footer class="roadmap-foot">
        <a class="roadmap-source" data-roadmap-source href="https://github.com/p4774756/PunchClock/milestones" target="_blank" rel="noopener noreferrer">資料來源：GitHub Milestones</a>
      </footer>
    </div>
  </section>
  <section id="loginBoard" class="roadmap-board pt-login-board" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="home-login-title">
    <div class="roadmap-panel maple-window login-sheet pt-login-panel">
      <header class="maple-win-title roadmap-win-head">
        <h2 id="home-login-title">管理員登入</h2>
        <button type="button" class="roadmap-close-x" data-login-close aria-label="關閉">×</button>
      </header>
      <div class="login-sheet-body">
        <p class="login-lead">管理員請先登入</p>
        <div data-login-alert></div>
        <form data-login-form class="form-signin" method="post" action="/login">
          <div class="form-group">
            <label for="home-login-password">密碼</label>
            <div class="pwd-row">
              <input type="password" id="home-login-password" name="password" class="form-input" data-login-password required autocomplete="current-password" />
              <button type="button" class="btn btn-ghost btn-toggle-pwd" data-login-toggle-pwd title="顯示/隱藏密碼">顯示</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-submit" data-login-submit>登入</button>
        </form>
      </div>
    </div>
  </section>
  <section id="tasksBoard" class="roadmap-board" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="任務">
    <div class="roadmap-panel maple-window home-tasks-panel">
      <header class="maple-win-title roadmap-win-head">
        <h2>任務</h2>
        <button type="button" class="roadmap-close-x" data-tasks-close aria-label="關閉">×</button>
      </header>
      <div class="home-tasks-body">
        <div class="shell dash-panel" id="panel-devices" data-label="任務" role="tabpanel" hidden>
          <div class="content-panel content-panel-full">
            <main id="clientContainer">
              <div class="empty-state"><p>還沒有設備連上來</p><p>等桌面端連上並回報狀態後，任務會出現在這裡</p></div>
            </main>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="/js/dash-tab.js"></script>
  <script type="module" src="/js/device-fold.js"></script>
  <script src="/js/dashboard.js"></script>
  <script type="module" src="/js/office-page.js"></script>
</body>
</html>
