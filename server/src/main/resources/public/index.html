<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clickClick · 遠端打卡監控</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <nav class="site-navbar" aria-label="主選單">
    <div class="site-navbar-inner">
      <div class="navbar-brand">
        <div class="brand-logo" aria-hidden="true">c<em>C</em></div>
        <div class="navbar-brand-text">
          clickClick 打卡工具
          <small>Remote Check-in Monitor · v{{SERVER_VERSION}}</small>
        </div>
      </div>
      <div class="top-actions">
        <span class="chip chip-admin">管理員</span>
        <a href="/logout" class="btn-logout">登出</a>
      </div>
    </div>
  </nav>

  <div class="site-banner">
    <div class="site-banner-inner">
      <h1 class="header-title">遠端打卡監控控制台</h1>
      <p class="header-sub">即時同步桌面端心跳、排程任務與系統日誌</p>
    </div>
  </div>

  <div class="shell">
    <aside class="daily-proverb" aria-label="今日六人行經典台詞">
      <div class="proverb-head">
        <div class="proverb-kicker">今日六人行 · {{DAILY_PROVERB_DATE}}</div>
        <button type="button" class="btn-speak" id="speakProverbBtn" aria-label="朗讀英文台詞">發音</button>
      </div>
      <blockquote class="proverb-en">{{DAILY_PROVERB_EN}}</blockquote>
      <p class="proverb-context">{{DAILY_PROVERB_CONTEXT}}</p>
      <p class="proverb-zh">{{DAILY_PROVERB_ZH}}</p>
    </aside>

    <div class="content-panel">
      <main id="clientContainer">
        <div class="empty-state"><p>連線狀態載入中…</p><p>正在同步裝置心跳</p></div>
      </main>
    </div>
  </div>

  <footer class="site-footer">
    clickClick 管理後台 · 樣式參考臺北市校務行政系統入口
  </footer>

  <script src="/js/dashboard.js"></script>
</body>
</html>
