<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日打卡狀態</title>
  <link rel="stylesheet" href="/css/lab-office.css">
  <link rel="stylesheet" href="/css/checkin.css">
  <script>window.PUNCHCLOCK_AUTHENTICATED = {{AUTH_JS_BOOL}};</script>
</head>
<body class="lab-office-page checkin-page {{AUTH_BODY_CLASS}}">
  <section class="checkin-root" aria-label="今日打卡狀態">
    <header class="lab-office-head">
      <h1>打卡鐘</h1>
      <a class="lab-office-close" href="/">回辦公室</a>
    </header>
    <div class="checkin-body">
      <p class="checkin-lead" data-checkin-lead>讀取中…</p>
      <div class="checkin-summary" data-checkin-summary hidden></div>
      <p class="checkin-guest-hint is-guest-only" data-guest-only>以上為公開摘要。登入後可查看各設備的完整排程與事件。</p>
      <p class="checkin-guest-hint" data-auth-only hidden data-checkin-detail-hint></p>
      <p class="checkin-foot"><a href="/">← 虛擬辦公室首頁</a> · <a href="/download">下載桌面端</a></p>
    </div>
  </section>
  <script src="/js/checkin-page.js" type="module"></script>
</body>
</html>
