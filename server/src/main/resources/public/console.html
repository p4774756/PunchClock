<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理主控台 · v{{SERVER_VERSION}}</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/console.css">
  <link rel="stylesheet" href="/css/graffiti.css">
  <link rel="stylesheet" href="/css/roadmap.css">
  <link rel="stylesheet" href="/css/dev-guest-ui.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="console-page {{AUTH_BODY_CLASS}}">
  <script>window.PUNCHCLOCK_AUTHENTICATED = {{AUTH_JS_BOOL}};</script>
  <script>window.PUNCHCLOCK_DONATE = {{DONATE_SCRIPT}};</script>
  <header class="console-head" aria-label="主控台導覽">
    <div class="console-brand">
      <strong>管理主控台</strong>
      <small>v{{SERVER_VERSION}} · {{SERVER_BUILD_TIME}}</small>
    </div>
    <nav class="console-nav" aria-label="分頁">
      <button type="button" class="console-tab" data-tab="devices">任務</button>
      <button type="button" class="console-tab" data-open-roadmap>施工進度</button>
      <a class="console-tab console-link" href="/">辦公室</a>
    </nav>
    <div class="console-auth">
      <a href="/login?next=%2Fconsole%23devices" data-guest-only>登入</a>
      <a href="/logout" data-auth-only>登出</a>
    </div>
  </header>
  <section id="graffitiBoard" class="graffiti-board" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="簽到本">
    <div class="graffiti-panel">
      <header class="graffiti-head">
        <div>
          <h2>簽到本</h2>
          <p>畫一幅小圖，署名可留可不留。送出就貼上，只有管理員能移除。</p>
        </div>
        <button type="button" class="btn btn-ghost" data-graffiti-back aria-label="返回主控台">返回主控台</button>
      </header>
      <div class="graffiti-studio">
        <div>
          <canvas class="graffiti-canvas" data-graffiti-paint width="512" height="256" aria-label="簽到畫布"></canvas>
          <div class="graffiti-tools" role="group" aria-label="畫筆">
            <button type="button" class="graffiti-swatch" data-graffiti-color="#1f2430" style="background:#1f2430" aria-label="墨色"></button>
            <button type="button" class="graffiti-swatch" data-graffiti-color="#f06a2a" style="background:#f06a2a" aria-label="橘色"></button>
            <button type="button" class="graffiti-swatch" data-graffiti-color="#1f4d73" style="background:#1f4d73" aria-label="藍色"></button>
            <button type="button" class="graffiti-swatch" data-graffiti-color="#f4a0c0" style="background:#f4a0c0" aria-label="粉色"></button>
            <button type="button" class="graffiti-swatch" data-graffiti-color="#7ec8ea" style="background:#7ec8ea" aria-label="水色"></button>
            <button type="button" class="graffiti-swatch" data-graffiti-color="#9fd9b4" style="background:#9fd9b4" aria-label="綠色"></button>
            <button type="button" class="graffiti-swatch" data-graffiti-color="#f6d35a" style="background:#f6d35a" aria-label="黃色"></button>
            <button type="button" class="graffiti-swatch" data-graffiti-color="#ffffff" style="background:#ffffff" aria-label="白色"></button>
            <button type="button" class="btn btn-ghost graffiti-brush" data-graffiti-brush="4" aria-label="細筆">細</button>
            <button type="button" class="btn btn-ghost graffiti-brush" data-graffiti-brush="14" aria-label="中筆">中</button>
            <button type="button" class="btn btn-ghost graffiti-brush" data-graffiti-brush="28" aria-label="粗筆">粗</button>
            <button type="button" class="btn btn-ghost" data-graffiti-eraser aria-pressed="false">橡皮擦</button>
            <button type="button" class="btn btn-ghost" data-graffiti-undo>復原</button>
            <button type="button" class="btn btn-ghost" data-graffiti-clear>清空</button>
          </div>
          <div class="graffiti-sign">
            <label for="graffitiSignature">署名</label>
            <input id="graffitiSignature" data-graffiti-signature maxlength="12" autocomplete="nickname" placeholder="路過的旅人" aria-label="署名，選填，最多 12 字">
            <button type="button" class="btn btn-primary" data-graffiti-submit>貼上簽到本</button>
          </div>
          <p class="graffiti-status" data-graffiti-status role="status"></p>
        </div>
        <div class="graffiti-list" data-graffiti-list aria-label="簽到列表"></div>
      </div>
    </div>
  </section>

  <section id="roadmapBoard" class="roadmap-board" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="施工進度">
    <div class="roadmap-panel maple-window">
      <header class="maple-win-title roadmap-win-head">
        <h2>施工進度</h2>
        <button type="button" class="roadmap-close-x" data-roadmap-back aria-label="關閉">×</button>
      </header>
      <div class="roadmap-banner">
        <div class="roadmap-banner-text">
          <strong class="roadmap-now" data-roadmap-headline>施工進度</strong>
          <span class="roadmap-phase-name" data-roadmap-title></span>
        </div>
        <div class="roadmap-banner-progress">
          <span class="roadmap-total-label" data-roadmap-total-label>子項合計 0/0</span>
          <div class="roadmap-progress-track"><span class="roadmap-progress-bar" data-roadmap-total-bar></span></div>
        </div>
      </div>
      <div class="roadmap-tabs" role="tablist" aria-label="施工進度分頁">
        <button type="button" class="roadmap-tab is-active" data-roadmap-tab="phases" role="tab" aria-pressed="true">路線圖</button>
        <button type="button" class="roadmap-tab" data-roadmap-tab="dev" role="tab" aria-pressed="false">開發進度</button>
      </div>
      <div class="roadmap-search">
        <input type="search" class="roadmap-search-input" data-roadmap-search placeholder="搜尋 i349、#349、p372 或標題關鍵字" autocomplete="off" enterkeyhint="search" />
        <button type="button" class="roadmap-search-clear" data-roadmap-search-clear hidden>清除</button>
        <p class="roadmap-search-empty" data-roadmap-search-empty hidden>找不到</p>
      </div>
      <div class="roadmap-layout">
        <div class="roadmap-main-stack">
          <div class="roadmap-tab-panel" data-roadmap-panel="phases">
            <div class="roadmap-list" data-roadmap-list></div>
          </div>
          <section class="roadmap-tab-panel roadmap-dev" data-roadmap-panel="dev" hidden aria-label="開發進度">
            <p class="roadmap-dev-note" data-dev-note></p>
            <div class="roadmap-dev-focus">
              <div class="roadmap-dev-card" data-dev-current></div>
              <div class="roadmap-dev-card" data-dev-next></div>
            </div>
            <div class="roadmap-dev-mid">
              <div class="roadmap-dev-queue-block">
                <h4 class="roadmap-dev-sub">排隊</h4>
                <div data-dev-queue></div>
              </div>
              <div class="roadmap-dev-stats-block">
                <h4 class="roadmap-dev-sub">本週</h4>
                <div data-dev-stats></div>
              </div>
            </div>
            <h4 class="roadmap-dev-sub">進度表</h4>
            <div class="roadmap-dev-filters" data-dev-filter role="group" aria-label="狀態篩選"></div>
            <div class="roadmap-dev-table-wrap" data-dev-table></div>
            <h4 class="roadmap-dev-sub">近 7 天</h4>
            <div data-dev-timeline></div>
          </section>
        </div>
      </div>
      <p class="roadmap-note" data-roadmap-note></p>
      <footer class="roadmap-foot">
        <a class="roadmap-source" data-roadmap-source href="https://github.com/p4774756/PunchClock/milestones" target="_blank" rel="noopener noreferrer">資料來源：GitHub Milestones</a>
        <span class="roadmap-dev-machines-nav" data-dev-machines-nav hidden></span>
      </footer>
    </div>
  </section>
  <section id="consoleSheet" class="console-sheet" hidden>
    <header class="maple-win-title console-sheet-bar">
      <h2 id="consoleSheetTitle">任務</h2>
      <button type="button" class="maple-win-close" id="consoleSheetClose" aria-label="關閉">
        <span class="maple-win-close-glyph" aria-hidden="true">×</span>
        <span class="console-esc-chip" aria-hidden="true">Esc</span>
      </button>
    </header>
    <div class="console-sheet-body">
      <div class="shell dash-panel" id="panel-guest-gate" data-label="需登入" role="tabpanel" hidden>
        <div class="content-panel content-panel-full">
          <section class="console-guest-gate" aria-label="登入後可操作">
            <p class="console-guest-gate-lead">這是管理員功能。</p>
            <p class="console-guest-gate-hint" id="consoleGuestHint">登入後可操作任務。</p>
            <a class="btn btn-primary" href="/login?next=%2Fconsole%23devices">前往登入</a>
          </section>
        </div>
      </div>

      <div class="shell dash-panel" id="panel-devices" data-label="任務" role="tabpanel" hidden>
        <div class="content-panel content-panel-full">
          <main id="clientContainer">
            <div class="empty-state"><p>還沒有設備連上來</p><p>等桌面端連上並回報狀態後，任務會出現在這裡</p></div>
          </main>
        </div>
      </div>

    </div>
  </section>
  <script src="/js/dash-tab.js"></script>
  <script type="module" src="/js/device-fold.js"></script>
  <script src="/js/dashboard.js"></script>
  <script type="module" src="/js/console-boot.js"></script>
</body>
</html>
