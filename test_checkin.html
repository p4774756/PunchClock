<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動打卡測試網頁 - Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-checkin {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        .btn-checkin:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -3px rgba(59, 130, 246, 0.6);
        }
        .btn-checkin.success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.5);
        }
        .status-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed #334155;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⏰ 自動打卡測試頁面</h1>
        <p>測試按鈕的 HTML Element ID 為 <code>check_in</code></p>
        
        <!-- 目標打卡按鈕 -->
        <button id="check_in" class="btn-checkin" onclick="handleCheckIn()">👉 點我打卡 (ID: check_in)</button>
        
        <div id="status" class="status-box">
            狀態：等待點擊中...
        </div>
    </div>

    <script>
        function handleCheckIn() {
            const btn = document.getElementById('check_in');
            const status = document.getElementById('status');
            const now = new Date().toLocaleTimeString();

            btn.classList.add('success');
            btn.innerHTML = '🎉 打卡成功！';
            status.style.borderColor = '#22c55e';
            status.style.color = '#4ade80';
            status.innerHTML = `✅ 已於 ${now} 成功觸發點擊打卡！`;
        }
    </script>
</body>
</html>
