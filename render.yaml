services:
  - type: web
    name: punchclock-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: HEARTBEAT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: punchclock-data
      mountPath: /var/data
      sizeGB: 1
